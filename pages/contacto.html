<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <!-- Nuestro css externo va como ultimo link antes del title -->
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto</title>
  </head>
  <body>
    <header>
      <div class="div-logo"><a class="logo" href="../index.html">LOGO</a></div>

      <p class="parrafo">Silvana Casavalle Musica</p>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
          <li><a href="./multimedia.html">Multimedia</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contacto">
        <h1 class="titulo contacto text-secondary">Contactanos</h1>
        <form
          class="form-contacto"
          action="https://formspree.io/f/xqpeekja"
          method="POST"
        >
          <div class="grupo-input">
            <label for="email"> Tu email: </label>
            <input id="email" type="email" name="email" />
          </div>

          <div class="grupo-input">
            <label for="mensaje"> Tu mensaje: </label>
            <textarea id="mensaje" name="message"></textarea>
          </div>
          <!-- your other form fields go here -->
          <button class="btn bg-secondary text-dark" type="submit">
            Enviar
          </button>
        </form>
      </section>
    </main>
    <footer>
      <p>Sitio realizado por EL VUELO</p>
      <nav>
        <ul class="footer-list">
          <li>
            <img src="../img/logo whatsapp.png" alt="logo whatsapp" />
            <img src="../img/logo instagram.png" alt="logo instagram" />
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
